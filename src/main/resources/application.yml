spring:
  application:
    name: snapbook

server:
  forward-headers-strategy: framework

---

spring:
  config:
    activate:
      on-profile: local
  application:
    name: snapbook
  datasource:
    url: jdbc:h2:file:./data/testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  kakao:
    auth:
      client: ${KAKAO_CLIENT_ID}
      redirect: http://localhost:8080/oauth/login/kakao
jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration: 31536000000  # 로컬 테스트용, 유효기간 1년
  refresh-token-expiration: 3153600000

swagger:
  server-url: http://localhost:8080

---

spring:
  config:
    activate:
      on-profile: dev
  application:
    name: snapbook
  datasource:
    url: ${DB_HOST}
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kakao:
    auth:
      client: ${KAKAO_CLIENT_ID}
      redirect: https://ssnapbook.netlify.app/auth
jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration: 31536000000 # 배포 테스트용
  refresh-token-expiration: 3153600000

swagger:
  server-url: https://snapbook.store
