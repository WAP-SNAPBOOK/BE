spring:
  application:
    name: snapbook
  flyway:
    enabled: true
    locations: classpath:db/baseline
    baseline-on-migrate: true
    baseline-version: 0
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

aws:
  s3:
    bucket: snapbook-bucket
    base-url: https://snapbook-bucket.s3.ap-northeast-2.amazonaws.com
    access-key: ${AWS_ACCESS_KEY}
    secret-key: ${AWS_SECRET_KEY}

server:
  forward-headers-strategy: framework

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId}] %logger - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      all: true
    distribution:
      # 1) HTTP 서버/클라이언트, JDBC/Hikari에 히스토그램 생성
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        jdbc.connections: true
        hikaricp.connections: true
      # 2) SLO 경계(버킷) – Grafana에서 histogram_quantile로 p95/p99 뽑을 때 기준
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s,5s
        jdbc.connections: 10ms,50ms,100ms,250ms,500ms,1s



---

spring:
  config:
    activate:
      on-profile: local
  application:
    name: snapbook
  flyway:
    enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/local_snapbook?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: snapbook
    password: snapbookpw
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 50

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kakao:
    auth:
      client: ${KAKAO_CLIENT_ID}
      redirect: http://localhost:8080/oauth/login/kakao
      redirect-local: http://localhost:5173/auth
jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration: 31536000000  # 로컬 테스트용, 유효기간 1년
  refresh-token-expiration: 3153600000

server-url: http://localhost:8080
frontend-base-url: http://localhost:5173

logging:
  level:
    root: WARN
    com.example.easybooking: INFO
    org.hibernate.SQL: DEBUG
---

spring:
  config:
    activate:
      on-profile: dev
  application:
    name: snapbook
  flyway:
    enabled: false
  datasource:
    url: ${DB_HOST}
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  kakao:
    auth:
      client: ${KAKAO_CLIENT_ID}
      redirect-local: http://localhost:5173/auth
      redirect: https://snapbook-web.netlify.app/auth
jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration: 7200000 # 2시간
  refresh-token-expiration: 604800000 # 7일

server-url: https://snapbook.store
frontend-base-url: https://snapbook-web.netlify.app

logging:
  level:
    root: WARN
    com.example.easybooking: INFO
